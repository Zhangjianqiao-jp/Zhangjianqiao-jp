name: Waka Readme

on:
  schedule:
    # 毎日 UTC 0:00 (日本時間 朝9時) に更新
    - cron: '0 0 * * *'
  workflow_dispatch: {}

jobs:
  update-readme:
    name: Update coding activity
    runs-on: ubuntu-latest
    permissions:
      contents: write
    steps:
      - uses: athul/waka-readme@master
        with:
          WAKATIME_API_KEY: ${{ secrets.WAKATIME_API_KEY }}
          GH_TOKEN: ${{ secrets.GH_TOKEN || secrets.GITHUB_TOKEN }}
